<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2217" />
      <stop offset="100%" stop-color="#060d09" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="url(#bgGrad)" stroke="#22c55e" stroke-opacity="0.4" stroke-width="2" />

  <!-- Subtle Inner Grid Accent -->
  <path d="M15 16v32h34" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Rising Chart Bars -->
  <rect x="22" y="33" width="5" height="10" rx="2.5" fill="url(#barGrad)" />
  <rect x="32" y="25" width="5" height="18" rx="2.5" fill="url(#barGrad)" />
  <rect x="42" y="29" width="5" height="14" rx="2.5" fill="url(#barGrad)" />

  <!-- Trend Line + Glow Dot -->
  <path d="M23 26 L34.5 17 L45 21.5" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="34.5" cy="17" r="3" fill="#86efac" />
  <circle cx="45" cy="21.5" r="3" fill="#4ade80" />
</svg>
